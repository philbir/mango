packages:
  - server
  - ui
  - docs-site
  - desktop

# Supply-chain cooldown: refuse package versions published less than 48h ago.
# Value is in MINUTES (2880 = 48h) — carried over from Yarn's npmMinimalAgeGate.
minimumReleaseAge: 2880

# Security pins (formerly Yarn `resolutions`) live in the root package.json
# under `pnpm.overrides`, NOT here. The Aspire CLI restores the TypeScript
# AppHost with `pnpm install --ignore-workspace`, which skips this file — any
# `overrides:` here would be dropped from pnpm-lock.yaml on every `aspire run`
# and break `pnpm install --frozen-lockfile`. server/test/lockfile.test.ts
# enforces this.

# Install scripts stay off (parity with Yarn's enableScripts: false). esbuild
# ships prebuilt platform binaries via optionalDependencies, so its postinstall
# isn't needed.
ignoredBuiltDependencies:
  - esbuild
  - protobufjs
