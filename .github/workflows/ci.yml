name: CI

# The release workflows only run on tags, so nothing installed, tested or
# built the workspace on a PR — a lockfile that had lost its `overrides`
# (see pnpm-workspace.yaml) sat broken on main until release day. The
# frozen install and server/test/lockfile.test.ts below catch that on the PR.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # See desktop-build.yml: no package-manager cache, pnpm comes from
          # corepack after this step.
          package-manager-cache: false

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      # UI `tsc -b && vite build`, then server `tsc`. The apphost lint is left
      # out: it's type-aware and needs Aspire's generated (gitignored) .modules/.
      - run: pnpm build
