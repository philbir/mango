name: Build desktop app

on:
  push:
    # Plain SemVer tags, no `v` prefix — `0.1.0`, `0.1.0-alpha.4`, etc.
    tags: ["[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS: arm64 only. macos-13 (Intel) runners are deprecated/scarce
          # and Rosetta runs the arm64 binary fine on Intel Macs. Add a
          # native x86_64 row if/when we ship a non-Rosetta build.
          - { runner: macos-14,        target: aarch64-apple-darwin,        bundles: "app,dmg"  }
          # Linux: deb only — AppImage bundling via linuxdeploy is fragile
          # in CI and not our primary distribution channel.
          - { runner: ubuntu-22.04,    target: x86_64-unknown-linux-gnu,    bundles: "deb"      }
          - { runner: windows-latest,  target: x86_64-pc-windows-msvc,      bundles: "msi,nsis" }

    runs-on: ${{ matrix.runner }}
    name: ${{ matrix.target }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: corepack enable

      - uses: oven-sh/setup-bun@v2
        with:
          # 1.3.13 was the version in use when 0.2.5 built cleanly on macOS.
          # 1.3.12 turned out to ship a `bun build --compile` output whose
          # signature codesign refuses to overwrite ("invalid or unsupported
          # format for signature"). Keep the pin so a future `latest` regression
          # can't silently break signed releases.
          bun-version: 1.3.13

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux deps
        if: startsWith(matrix.runner, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            patchelf

      - run: yarn install --immutable

      - run: yarn workspace @mango/ui build

      - run: yarn compile-server ${{ matrix.target }}

      # Notarization needs the App Store Connect .p8 private key on disk.
      # The secret holds the base64-encoded file; decode and export the
      # path so tauri-action picks it up. No-op on non-macOS runners and
      # when the secret isn't set.
      - name: Decode App Store Connect API key (macOS only)
        if: startsWith(matrix.runner, 'macos-')
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          if [ -n "$APPLE_API_KEY_BASE64" ]; then
            mkdir -p "$HOME/.private_keys"
            echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$HOME/.private_keys/AuthKey.p8"
            echo "APPLE_API_KEY_PATH=$HOME/.private_keys/AuthKey.p8" >> "$GITHUB_ENV"
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS code-signing + notarization. Tauri-action only acts on
          # these when bundling for macOS targets; on other runners they
          # resolve to empty strings and are ignored. Until the secrets
          # are populated on GitHub the build falls back to ad-hoc signing
          # (same behavior as before this commit) — no breakage.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Notarization via App Store Connect API key (preferred over
          # app-specific passwords). Set ALL of APPLE_API_* together.
          # APPLE_API_KEY_PATH is exported by the decode step above.
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Mango ${{ github.ref_name }}"
          # Publish immediately so artifacts are downloadable from the
          # Releases page. Tags with a dash (e.g. v0.1.0-alpha.3) are
          # marked as pre-releases.
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
