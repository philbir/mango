name: Build desktop app

on:
  push:
    # Plain SemVer tags, no `v` prefix — `0.1.0`, `0.1.0-alpha.4`, etc.
    tags: ["[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS: arm64 only. macos-13 (Intel) runners are deprecated/scarce
          # and Rosetta runs the arm64 binary fine on Intel Macs. Add a
          # native x86_64 row if/when we ship a non-Rosetta build.
          - { runner: macos-14,        target: aarch64-apple-darwin,        bundles: "app,dmg"  }
          # Linux: deb only — AppImage bundling via linuxdeploy is fragile
          # in CI and not our primary distribution channel.
          - { runner: ubuntu-22.04,    target: x86_64-unknown-linux-gnu,    bundles: "deb"      }
          - { runner: windows-latest,  target: x86_64-pc-windows-msvc,      bundles: "msi,nsis" }

    runs-on: ${{ matrix.runner }}
    name: ${{ matrix.target }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: corepack enable

      - uses: oven-sh/setup-bun@v2
        with:
          # 1.3.13 was the version in use when 0.2.5 built cleanly on macOS.
          # 1.3.12 turned out to ship a `bun build --compile` output whose
          # signature codesign refuses to overwrite ("invalid or unsupported
          # format for signature"). Keep the pin so a future `latest` regression
          # can't silently break signed releases.
          bun-version: 1.3.13

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux deps
        if: startsWith(matrix.runner, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            patchelf

      - run: yarn install --immutable

      # Defensive sync: rewrite desktop/package.json, tauri.conf.json,
      # src-tauri/Cargo.toml, and src-tauri/Cargo.lock to the tag version so
      # the bundled installers' filenames and Info.plist always match the
      # tag — even when a release PR forgets to bump those files (see
      # 0.3.3 → 0.3.6, which all shipped as Mango_0.3.2_*.dmg).
      - name: Sync desktop version from tag
        if: github.ref_type == 'tag'
        shell: bash
        run: node desktop/scripts/sync-version.mjs "${GITHUB_REF_NAME}"

      - run: yarn workspace @mango/ui build

      - run: yarn compile-server ${{ matrix.target }}

      # The MSI/WiX bundler can only encode a numeric-only pre-release
      # identifier in the ProductVersion (e.g. `0.5.0-1`), and rejects
      # `0.5.0-beta.1` outright. Drop MSI for pre-release tags — NSIS handles
      # SemVer pre-releases and is what the Windows updater consumes anyway.
      - name: Resolve bundles for this tag
        id: bundles
        shell: bash
        run: |
          B="${{ matrix.bundles }}"
          if [[ "${{ matrix.target }}" == "x86_64-pc-windows-msvc" && "${GITHUB_REF_NAME}" == *-* ]]; then
            B="nsis"
            echo "Pre-release tag ${GITHUB_REF_NAME}: building nsis only (skipping msi)."
          fi
          echo "value=$B" >> "$GITHUB_OUTPUT"

      # Notarization needs the App Store Connect .p8 private key on disk.
      # The secret holds the base64-encoded file; decode and export the
      # path so tauri-action picks it up. No-op on non-macOS runners and
      # when the secret isn't set.
      - name: Decode App Store Connect API key (macOS only)
        if: startsWith(matrix.runner, 'macos-')
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          if [ -n "$APPLE_API_KEY_BASE64" ]; then
            mkdir -p "$HOME/.private_keys"
            echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$HOME/.private_keys/AuthKey.p8"
            echo "APPLE_API_KEY_PATH=$HOME/.private_keys/AuthKey.p8" >> "$GITHUB_ENV"
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS code-signing + notarization. Tauri-action only acts on
          # these when bundling for macOS targets; on other runners they
          # resolve to empty strings and are ignored. Until the secrets
          # are populated on GitHub the build falls back to ad-hoc signing
          # (same behavior as before this commit) — no breakage.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Notarization via App Store Connect API key (preferred over
          # app-specific passwords). Set ALL of APPLE_API_* together.
          # APPLE_API_KEY_PATH is exported by the decode step above.
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          # Updater artifact signing. Generate the keypair once with:
          #   npx @tauri-apps/cli signer generate -w ~/.tauri/mango.key
          # Store the private key in TAURI_SIGNING_PRIVATE_KEY and the
          # password (if any) in TAURI_SIGNING_PRIVATE_KEY_PASSWORD.
          # tauri-action will sign every installable artifact and include
          # a latest.json manifest in the release assets.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Mango ${{ github.ref_name }}"
          # Publish immediately so artifacts are downloadable from the
          # Releases page. Tags with a dash (e.g. v0.1.0-alpha.3) are
          # marked as pre-releases.
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          # tauri-action's own latest.json emitter trips over the asset
          # rename it does on upload (Mango.app.tar.gz → Mango_aarch64.app.tar.gz),
          # so the manifest is skipped and .sig files never get attached.
          # We compose latest.json ourselves in the `publish-updater` job below.
          includeUpdaterJson: false
          args: --target ${{ matrix.target }} --bundles ${{ steps.bundles.outputs.value }}

      # With createUpdaterArtifacts on, tauri-action uploads each installer and
      # its .sig — EXCEPT on macOS, where it renames the updater tarball to
      # Mango_aarch64.app.tar.gz but leaves the matching .sig behind. Upload
      # that one here so publish-updater can pair it.
      - name: Attach updater signatures to release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          BUNDLE="desktop/src-tauri/target/${TARGET}/release/bundle"
          case "${TARGET}" in
            aarch64-apple-darwin)
              # tauri-action uploaded the bundle as Mango_aarch64.app.tar.gz —
              # rename the sig to match so the publish-updater job can pair them.
              cp "${BUNDLE}/macos/Mango.app.tar.gz.sig" \
                 "Mango_aarch64.app.tar.gz.sig"
              gh release upload "${VERSION}" \
                "Mango_aarch64.app.tar.gz.sig" --clobber
              ;;
            x86_64-pc-windows-msvc)
              # With createUpdaterArtifacts on, tauri-action uploads the NSIS
              # installer (Mango_<v>_x64-setup.exe) AND its .exe.sig itself —
              # the Windows updater installs from the .exe directly. Nothing to
              # attach here.
              echo "Windows updater .exe + .sig uploaded by tauri-action — skipping."
              ;;
            x86_64-unknown-linux-gnu)
              echo "Linux ships .deb only — no updater bundle, skipping."
              ;;
          esac

  # Compose latest.json from the per-platform sigs the matrix attached and
  # publish it to the release. The updater client at
  # github.com/philbir/mango/releases/latest/download/latest.json reads this.
  publish-updater:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate and upload latest.json
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p sigs
          gh release download "${VERSION}" --pattern '*.sig' --dir sigs

          BASE="https://github.com/${GH_REPO}/releases/download/${VERSION}"
          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          NOTES=$(gh release view "${VERSION}" --json body --jq '.body // ""')

          PLATFORMS='{}'

          MAC_SIG_PATH="sigs/Mango_aarch64.app.tar.gz.sig"
          if [ -f "${MAC_SIG_PATH}" ]; then
            MAC_SIG=$(cat "${MAC_SIG_PATH}")
            PLATFORMS=$(jq -n \
              --arg sig "${MAC_SIG}" \
              --arg url "${BASE}/Mango_aarch64.app.tar.gz" \
              '{ "darwin-aarch64": { signature: $sig, url: $url } }')
          fi

          WIN_SIG_PATH="sigs/Mango_${VERSION}_x64-setup.exe.sig"
          if [ -f "${WIN_SIG_PATH}" ]; then
            WIN_SIG=$(cat "${WIN_SIG_PATH}")
            PLATFORMS=$(echo "${PLATFORMS}" | jq \
              --arg sig "${WIN_SIG}" \
              --arg url "${BASE}/Mango_${VERSION}_x64-setup.exe" \
              '. + { "windows-x86_64": { signature: $sig, url: $url } }')
          fi

          jq -n \
            --arg version "${VERSION}" \
            --arg notes "${NOTES}" \
            --arg pub_date "${PUB_DATE}" \
            --argjson platforms "${PLATFORMS}" \
            '{ version: $version, notes: $notes, pub_date: $pub_date, platforms: $platforms }' \
            > latest.json

          echo "--- latest.json ---"
          cat latest.json
          gh release upload "${VERSION}" latest.json --clobber
