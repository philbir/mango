name: Build desktop app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS: arm64 only. macos-13 (Intel) runners are deprecated/scarce
          # and Rosetta runs the arm64 binary fine on Intel Macs. Add a
          # native x86_64 row if/when we ship a non-Rosetta build.
          - { runner: macos-14,        target: aarch64-apple-darwin,        bundles: "app,dmg"  }
          # Linux: deb only — AppImage bundling via linuxdeploy is fragile
          # in CI and not our primary distribution channel.
          - { runner: ubuntu-22.04,    target: x86_64-unknown-linux-gnu,    bundles: "deb"      }
          - { runner: windows-latest,  target: x86_64-pc-windows-msvc,      bundles: "msi,nsis" }

    runs-on: ${{ matrix.runner }}
    name: ${{ matrix.target }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: corepack enable

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux deps
        if: startsWith(matrix.runner, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            patchelf

      - run: yarn install --immutable

      - run: yarn workspace @mango/ui build

      - run: yarn compile-server ${{ matrix.target }}

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Mango ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
