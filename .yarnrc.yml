approvedGitRepositories:
  - "**"

enableGlobalCache: true

enableScripts: false

nodeLinker: node-modules

# Supply-chain cooldown: refuse package versions newer than this. The value is
# in MINUTES (not seconds) — 2880 = 48h. The previous 172800 read as 120 days,
# which quarantined essentially every update.
npmMinimalAgeGate: 2880
